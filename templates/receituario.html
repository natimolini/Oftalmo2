<div class="receituario">
    <div class="opcoes">
        <h1>Receituário:</h1>
        
        <div class="top">
            <label for="pesquisa_medicamento">Pesquisar Medicamento:</label>
            <input type="text" id="pesquisa-medicamento" placeholder="Digite para pesquisar...">

            <div style="display: none;">
                <label for="protocolo">Protocolo Receituário:</label>
                <input type="text">
            </div>

            <section class="lista-medicamento-protocolo">
                <ul></ul>
            </section>
        </div>
    </div>

    <div class="textarea-container">
        <!-- Abas para alternar entre receitas -->
        <div class="receita-tabs">
            <button class="receita-tab active" data-tab="receita1">Receita</button>
            <button class="receita-tab" data-tab="receita2">Segunda Receita</button>
        </div>

        <!-- Conteúdo das abas -->
        <div class="receita-tab-content">
            <div class="receita-pane active" id="receita1-pane">
                <textarea name="ds_receita" class="textarea-receituario" id="receita"></textarea>
            </div>
            <div class="receita-pane" id="receita2-pane">
                <textarea name="ds_receita2" class="textarea-receituario" id="receita2"></textarea>
            </div>
        </div>

        <div class="copias">
            <label for="Número de cópias">Número de cópias</label>
            <input type="number" id="qtd-copias" value="1" max="3">
        </div>
    </div>
</div>
